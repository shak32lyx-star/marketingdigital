<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIDE Coach · Connexion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="demo-tag">Maquette de démonstration : état « le serveur se réveille » (cliquez sur Réessayer)</div>
<div class="login-wrap">
  <div class="login-card">
    <p style="text-align:center"><a class="brand" style="justify-content:center" href="01-landing.html"><span class="logo">F</span>FIDE Coach</a></p>
    <form class="card" id="f" style="margin-top:16px" novalidate>
      <h1 style="font-size:24px;margin-bottom:4px">Se connecter</h1>
      <p class="muted" style="margin:0 0 18px">Pas encore de compte ? <a href="02-accueil.html">Créer un compte gratuit</a></p>

      <div class="field"><label for="u">E-mail</label><input class="input" id="u" type="email" autocomplete="email" value="camille@exemple.ch"></div>
      <div class="field">
        <div style="display:flex;justify-content:space-between"><label for="p">Mot de passe</label><a href="#" style="min-height:44px;display:inline-flex;align-items:center;font-size:14px">Mot de passe oublié ?</a></div>
        <div class="pw"><input class="input" id="p" type="password" value="motdepasse123" autocomplete="current-password"><button type="button" id="eye" aria-label="Afficher le mot de passe">👁</button></div>
      </div>
      <label class="check"><input type="checkbox" checked> Rester connecté</label>

      <div class="alert info" id="msg" role="status" style="margin:12px 0">
        <span aria-hidden="true">⏳</span>
        <span><b>Le serveur se réveille.</b> Cela peut prendre quelques secondes. Vos identifiants n'ont pas de problème.</span>
      </div>
      <button class="btn block" id="go" type="submit">Réessayer</button>
    </form>
  </div>
</div>
<script>
  var eye = document.getElementById('eye'), p = document.getElementById('p');
  eye.addEventListener('click', function () {
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
  });
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = document.getElementById('go'), m = document.getElementById('msg');
    b.disabled = true; b.textContent = 'Connexion en cours…';
    setTimeout(function () { location.href = '02-accueil.html'; }, 1500);
  });
</script>
</body>
</html>

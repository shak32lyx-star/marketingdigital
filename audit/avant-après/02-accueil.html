<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIDE Coach · Accueil</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-active="home">
<div class="app">
  <main>
    <section>
      <h1 style="font-size:28px">Bonjour Camille</h1>
      <p class="muted" style="margin:4px 0 0">Examen dans <b>42 jours</b> · Objectif A2</p>
    </section>

    <section class="card row" aria-label="Progression">
      <div class="ring" style="--p:0"><span>0/12</span></div>
      <div>
        <div class="muted" style="font-size:13px;font-weight:600">PROGRESSION</div>
        <div style="font-weight:650">Commencez votre première leçon</div>
      </div>
    </section>

    <section class="card" style="border-color:var(--brand)" aria-label="Prochaine leçon">
      <span class="chip">Ta prochaine leçon</span>
      <h2 style="font-size:22px;margin:10px 0 4px">Sich vorstellen</h2>
      <p class="muted" style="margin:0 0 14px">Unité 1 · Présent et verbes irréguliers · 10 min</p>
      <a class="btn block" href="03-lecon-fide.html">Commencer</a>
    </section>

    <section style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <a class="card" href="04-historique.html" style="text-decoration:none;color:inherit">
        <div style="font-size:24px" aria-hidden="true">📝</div>
        <b>Examen blanc</b><div class="muted" style="font-size:14px">4 parties · 2 h</div>
      </a>
      <a class="card" href="#" style="text-decoration:none;color:inherit">
        <div style="font-size:24px" aria-hidden="true">🔤</div>
        <b>Vocabulaire</b><div class="muted" style="font-size:14px">Révision du jour : 0 mot</div>
      </a>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>

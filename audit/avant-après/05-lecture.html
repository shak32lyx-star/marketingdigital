<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIDE Coach · Lecture : Die Mücke</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-active="book">
<div class="app">
  <main id="m">
    <div>
      <a class="back" href="03-lecon-fide.html">← Unité 1</a>
      <div><span class="chip">Lecture · Unité 1 · A1</span></div>
      <h1 style="font-size:30px;margin-top:8px">Die Mücke</h1>
    </div>

    <section class="card player" aria-label="Lecteur audio">
      <div class="top">
        <button class="play" id="play" aria-label="Lire l'audio">▶</button>
        <div style="flex:1"><div class="bar"><i id="prog"></i></div>
          <div class="muted" style="font-size:13px;margin-top:6px"><span id="now">Phrase 0 / 5</span></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div class="seg" role="group" aria-label="Vitesse">
          <button aria-pressed="false" data-s=".75">0,75×</button><button aria-pressed="true" data-s="1">1×</button>
        </div>
        <button class="btn quiet" id="tr" style="min-height:40px" aria-pressed="false">Traduction complète</button>
      </div>
    </section>

    <svg class="hero-img" viewBox="0 0 320 180" role="img" aria-label="Deux personnes dans une chambre la nuit, un moustique près de la lampe">
      <rect width="320" height="180" fill="#1b2a49"/>
      <rect x="190" y="30" width="80" height="70" fill="#3d6ea8" stroke="#0e1830" stroke-width="4"/>
      <circle cx="90" cy="40" r="22" fill="#f6d77b" opacity=".55"/><rect x="82" y="54" width="16" height="30" fill="#c9a13e"/>
      <circle cx="60" cy="86" r="11" fill="#e8b88f"/><rect x="48" y="96" width="24" height="46" rx="8" fill="#6b7fb5"/>
      <circle cx="250" cy="96" r="11" fill="#e8b88f"/><rect x="238" y="106" width="24" height="40" rx="8" fill="#d6dbe8"/>
      <rect x="0" y="140" width="320" height="40" fill="#13203a"/>
      <circle cx="104" cy="60" r="3" fill="#fff"/>
    </svg>

    <section class="reading" aria-label="Dialogue">
      <button class="line" data-i="1"><span class="who">Anna</span><span>Warum hast du das Licht angemacht?<span class="tr">Pourquoi as-tu allumé la lumière ?</span></span></button>
      <button class="line" data-i="2"><span class="who">Tom</span><span>Ich kann nicht schlafen. Ich habe eine <span class="w" data-w="Mücke" data-t="moustique">Mücke</span> gehört.<span class="tr">Je n'arrive pas à dormir. J'ai entendu un moustique.</span></span></button>
      <button class="line" data-i="3"><span class="who">Anna</span><span>Oh, nein! Wo ist sie?<span class="tr">Oh non ! Où est-il ?</span></span></button>
      <button class="line" data-i="4"><span class="who">Tom</span><span>Sie sitzt auf der Lampe.<span class="tr">Il est posé sur la lampe.</span></span></button>
      <button class="line" data-i="5"><span class="who">Tom</span><span>Schnell, gib mir die <span class="w" data-w="Zeitung" data-t="journal">Zeitung</span>! (klatsch!)<span class="tr">Vite, donne-moi le journal ! (clac !)</span></span></button>
      <p class="muted" style="font-family:var(--sans);font-size:14px">Touchez une phrase pour la traduire. Les mots soulignés ouvrent leur définition.</p>
    </section>

    <section class="card quiz" aria-labelledby="q">
      <h2 id="q" style="font-size:18px;margin-bottom:10px">Compréhension</h2>
      <fieldset><legend>Pourquoi Tom a-t-il allumé la lumière ?</legend>
        <label><input type="radio" name="q1"> Il a faim</label>
        <label><input type="radio" name="q1" data-ok> Il a entendu un moustique</label>
        <label><input type="radio" name="q1"> Il lit le journal</label></fieldset>
      <fieldset><legend>Où est le moustique ?</legend>
        <label><input type="radio" name="q2" data-ok> Sur la lampe</label>
        <label><input type="radio" name="q2"> Sur le lit</label>
        <label><input type="radio" name="q2"> Dans le journal</label></fieldset>
      <button class="btn secondary block" id="chk">Vérifier mes réponses</button>
      <p id="res" role="status" style="margin:10px 0 0"></p>
      <a class="btn block" style="margin-top:10px" href="03-lecon-fide.html">Unité suivante</a>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Définition">
  <h2 id="sw" style="font-size:22px"></h2>
  <p id="st" class="muted" style="margin:4px 0 14px"></p>
  <button class="btn block" id="add">Ajouter à mon vocabulaire</button>
  <button class="btn quiet block" id="close" style="margin-top:8px">Fermer</button>
</div>

<script src="app.js"></script>
<script>
  var lines = [].slice.call(document.querySelectorAll('.line')), timer, idx = 0, speed = 1;
  var play = document.getElementById('play'), prog = document.getElementById('prog'), now = document.getElementById('now');
  function show(i) {
    lines.forEach(function (l, k) { l.classList.toggle('playing', k === i - 1); });
    prog.style.width = (i / lines.length * 100) + '%';
    now.textContent = 'Phrase ' + i + ' / ' + lines.length;
  }
  function stop() { clearInterval(timer); timer = null; play.textContent = '▶'; play.setAttribute('aria-label', 'Lire l\'audio'); }
  play.addEventListener('click', function () {
    if (timer) return stop();
    if (idx >= lines.length) idx = 0;
    play.textContent = '❚❚'; play.setAttribute('aria-label', 'Mettre en pause');
    timer = setInterval(function () {
      idx++; show(idx);
      if (idx >= lines.length) stop();
    }, 2200 / speed);
    idx++; show(idx);
  });
  [].forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () {
      speed = parseFloat(b.dataset.s);
      [].forEach.call(document.querySelectorAll('.seg button'), function (x) { x.setAttribute('aria-pressed', x === b); });
    });
  });
  lines.forEach(function (l) { l.addEventListener('click', function (e) {
    if (e.target.classList.contains('w')) return;
    l.classList.toggle('open');
  }); });
  var tr = document.getElementById('tr');
  tr.addEventListener('click', function () {
    var on = tr.getAttribute('aria-pressed') !== 'true';
    tr.setAttribute('aria-pressed', on); tr.textContent = on ? 'Masquer la traduction' : 'Traduction complète';
    document.getElementById('m').classList.toggle('show-tr', on);
  });
  var sheet = document.getElementById('sheet');
  [].forEach.call(document.querySelectorAll('.w'), function (w) {
    w.addEventListener('click', function (e) {
      e.stopPropagation();
      document.getElementById('sw').textContent = w.dataset.w;
      document.getElementById('st').textContent = w.dataset.t;
      document.getElementById('add').textContent = 'Ajouter à mon vocabulaire';
      sheet.classList.add('open');
    });
  });
  document.getElementById('close').addEventListener('click', function () { sheet.classList.remove('open'); });
  document.getElementById('add').addEventListener('click', function () { this.textContent = '✔ Ajouté'; });
  document.getElementById('chk').addEventListener('click', function () {
    var ok = 0, all = 2;
    ['q1', 'q2'].forEach(function (n) { var c = document.querySelector('input[name=' + n + ']:checked'); if (c && c.hasAttribute('data-ok')) ok++; });
    document.getElementById('res').textContent = ok === all ? '✔ Bravo, 2 / 2 !' : ok + ' / ' + all + ' : relisez le dialogue et réessayez.';
  });
</script>
</body>
</html>

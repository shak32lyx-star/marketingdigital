<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIDE Coach · Mon compte</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-active="user">
<div class="app">
  <main>
    <div>
      <a class="back" href="02-accueil.html">← Programme</a>
      <div class="row"><span class="avatar" style="width:56px;height:56px;font-size:18px">CM</span>
        <div><h1 style="font-size:24px">Bonjour Camille</h1><span class="muted">Mon compte</span></div></div>
    </div>

    <section class="card" aria-labelledby="info">
      <h2 id="info" style="font-size:18px;margin-bottom:12px">Informations</h2>
      <div class="muted" style="font-size:13px;font-weight:600">E-MAIL</div><div>camille@exemple.ch</div>
      <div class="muted" style="font-size:13px;font-weight:600;margin-top:12px">DERNIÈRE CONNEXION</div><div>27 sept. 2026, 18 h 24</div>
    </section>

    <section class="card" aria-labelledby="prof">
      <h2 id="prof" style="font-size:18px;margin-bottom:12px">Mon objectif</h2>
      <div class="field"><label for="niv">Niveau visé</label>
        <select class="input" id="niv"><option>A1</option><option selected>A2</option><option>B1</option></select></div>
      <div class="field"><label for="dt">Date de l'examen</label><input class="input" id="dt" type="date" value="2026-12-13"></div>
      <div class="field" style="margin:0"><label for="min">Temps par jour</label>
        <select class="input" id="min"><option>10 min</option><option selected>15 min</option><option>30 min</option></select></div>
    </section>

    <section class="card" aria-labelledby="rap">
      <h2 id="rap" style="font-size:18px;margin-bottom:4px">Rappels</h2>
      <label class="switch">Rappel quotidien par e-mail <input type="checkbox" checked></label>
      <label class="switch">Récapitulatif hebdomadaire <input type="checkbox"></label>
      <div class="field" style="margin:0"><label for="h">Heure du rappel</label><input class="input" id="h" type="time" value="18:00"></div>
    </section>

    <section class="card" aria-labelledby="pw">
      <h2 id="pw" style="font-size:18px;margin-bottom:12px">Changer le mot de passe</h2>
      <div class="field"><label for="cur">Mot de passe actuel</label>
        <div class="pw"><input class="input" id="cur" type="password"><button type="button" aria-label="Afficher le mot de passe" onclick="var i=document.getElementById('cur');i.type=i.type==='password'?'text':'password'">👁</button></div></div>
      <div class="field"><label for="new">Nouveau mot de passe</label><input class="input" id="new" type="password"></div>
      <button class="btn secondary block">Enregistrer</button>
    </section>

    <section class="card" aria-labelledby="don">
      <h2 id="don" style="font-size:18px;margin-bottom:12px">Mes données</h2>
      <button class="btn quiet block">Exporter mes données</button>
      <button class="btn danger block" style="margin-top:10px">Supprimer mon compte</button>
      <p class="muted" style="font-size:14px;margin:12px 0 0"><a href="#">Politique de confidentialité</a></p>
    </section>

    <button class="btn quiet block" onclick="if(confirm('Se déconnecter ?'))location.href='01-landing.html'">Se déconnecter</button>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
